{{- if .Values.secretSyncJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crunchy-postgres-cluster.secretSyncJobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "crunchy-postgres-cluster.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
{{ toYaml .Values.secretSyncJob.annotations | indent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.secretSyncJob.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.secretSyncJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.secretSyncJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "crunchy-postgres-cluster.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "crunchy-postgres-cluster.secretSyncJobName" . }}
      containers:
        - name: sync
          image: {{ .Values.secretSyncJob.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              NS={{ .Release.Namespace | quote }}
              OBC={{ include "crunchy-postgres-cluster.obcName" . | quote }}
              OUT_SECRET={{ include "crunchy-postgres-cluster.pgbackrestSecretName" . | quote }}

              echo "Checking OBC Secret and ConfigMap: ${NS}/${OBC}"
              oc get secret "${OBC}" -n "${NS}" >/dev/null
              oc get configmap "${OBC}" -n "${NS}" >/dev/null

              AWS_ACCESS_KEY_ID=$(oc get secret "${OBC}" -n "${NS}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              AWS_SECRET_ACCESS_KEY=$(oc get secret "${OBC}" -n "${NS}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)

              cat > /tmp/s3.conf <<EOF_CONF
              [global]
              {{ .Values.pgbackrest.repoName }}-s3-key=${AWS_ACCESS_KEY_ID}
              {{ .Values.pgbackrest.repoName }}-s3-key-secret=${AWS_SECRET_ACCESS_KEY}
              EOF_CONF

              oc create secret generic "${OUT_SECRET}" \
                -n "${NS}" \
                --from-file=s3.conf=/tmp/s3.conf \
                --dry-run=client -o yaml | oc apply -f -

              echo "Secret ${NS}/${OUT_SECRET} is ready"
{{- end }}
