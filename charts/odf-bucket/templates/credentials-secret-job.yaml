{{- if .Values.credentialsSecret.enabled }}
{{- $jobName := include "odf-s3-bucket.credentialsJobName" . }}
{{- $sourceSecretName := default (include "odf-s3-bucket.obcName" .) .Values.credentialsSecret.sourceSecretName }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "odf-s3-bucket.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "odf-s3-bucket.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $sourceSecretName }}
      - {{ include "odf-s3-bucket.credentialsSecretName" . }}
    verbs: ["get", "patch", "update"]
  # Kubernetes ne permet pas de limiter "create" avec resourceNames, car le nom
  # de la ressource n'est pas encore disponible lors de l'autorisation.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "odf-s3-bucket.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $jobName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $jobName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "odf-s3-bucket.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.credentialsSecret.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.credentialsSecret.job.timeoutSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "odf-s3-bucket.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $jobName }}
      restartPolicy: Never
      containers:
        - name: create-credentials-secret
          image: "{{ .Values.credentialsSecret.job.image.repository }}:{{ .Values.credentialsSecret.job.image.tag }}"
          imagePullPolicy: {{ .Values.credentialsSecret.job.image.pullPolicy }}
          env:
            - name: SOURCE_SECRET_NAME
              value: {{ $sourceSecretName | quote }}
            - name: TARGET_SECRET_NAME
              value: {{ include "odf-s3-bucket.credentialsSecretName" . | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.credentialsSecret.endpoint | quote }}
            - name: ACCESS_KEY_FIELD
              value: {{ .Values.credentialsSecret.keys.accessKey | quote }}
            - name: SECRET_KEY_FIELD
              value: {{ .Values.credentialsSecret.keys.secretKey | quote }}
            - name: ENDPOINT_FIELD
              value: {{ .Values.credentialsSecret.keys.endpoint | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              until oc get secret "${SOURCE_SECRET_NAME}" >/dev/null 2>&1; do
                echo "Attente du Secret ODF ${SOURCE_SECRET_NAME}..."
                sleep 5
              done

              access_key="$(oc get secret "${SOURCE_SECRET_NAME}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
              secret_key="$(oc get secret "${SOURCE_SECRET_NAME}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"

              test -n "${access_key}" || { echo "AWS_ACCESS_KEY_ID est absent du Secret ODF"; exit 1; }
              test -n "${secret_key}" || { echo "AWS_SECRET_ACCESS_KEY est absent du Secret ODF"; exit 1; }

              oc create secret generic "${TARGET_SECRET_NAME}" \
                --from-literal="${ACCESS_KEY_FIELD}=${access_key}" \
                --from-literal="${SECRET_KEY_FIELD}=${secret_key}" \
                --from-literal="${ENDPOINT_FIELD}=${S3_ENDPOINT}" \
                --dry-run=client -o yaml | oc apply -f -
          {{- with .Values.credentialsSecret.job.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
{{- end }}
